<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS향수</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="header">
        <div class="header__left"></div>

        <div class="header__logo">
            <img src="assets/images/icon/logo.svg" alt="로고">
        </div>
        <nav class="header__nav">
            <div class="header__icons">
                <a href="#" class="header__icon_link" aria-label="로그인">
                    <img src="assets/images/icon/navi_login.svg" alt="로그인">
                </a>

            </div>
        </nav>
    </header>
    <main class="hero">
        <div class="hero__inner">

            <!-- 왼쪽 이미지 -->
            <div class="hero__visual">
                <img class="hero__image" src="assets/images/hero-img1.webp" alt="향수 이미지">
            </div>

            <!-- 오른쪽 텍스트 -->
            <div class="hero__content">
                <a href="#" class="hero__button">
                    <span class="hero__button-text">구매하기</span>
                </a>

                <p class="hero__desc">
                    섬세한 플로럴과 따뜻한 잔향이 어우러진
                    JS 오 드 퍼퓸을 만나보세요.
                </p>

                <h2 class="hero__title">Fragrance</h2>
            </div>

        </div>
    </main>
    <section class="about">
        <div class="about__inner">
            <div class="about__content">
                <div class="about__left">
                    <h2 class="about__title">JS <br>PERFUME</h2>
                </div>
                <div class="about__line"></div>
                <div class="about__right">
                    <p class="about__desc">
                        색감있는 기억이 됩니다. <br>
                        향기는 단순한 향을 넘어 당신의 분위기와 순간을 완성합니다.JS 퍼퓸은 자연에서 영감을 받은 섬세한 조향으로, 부드럽고 깊이 있는 향을 구현합니다. 은은하게 퍼지는 향은
                        일상에 감각을 더해주며, 당신만의 분위기를 더욱 또렷하게 만듭니다.
                    </p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
